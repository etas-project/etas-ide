name: Package VS Code Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Select Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - run: npm ci

      - run: npm run package:vsix

      - name: Replace Dev Release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev *.vsix \
            --prerelease \
            --title "Dev Build (${{ github.sha }})" \
            --notes "Built from commit ${{ github.sha }}"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.vsix \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
