[workspace]
members = [
    "crates/etas_intel",
    "crates/etas_lsp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-ide"

[workspace.dependencies]
etas_intel = { path = "crates/etas_intel" }
etas_lsp = { path = "crates/etas_lsp" }

# Cross-repo dependencies via git (same pattern as other workspaces)
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "53f7570806299f4313baa984546e4ceb808a2abe", package = "etas_core" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", rev = "53f7570806299f4313baa984546e4ceb808a2abe", package = "etas_std" }
etas_effects = { git = "https://github.com/etas-project/etas-frontend.git", rev = "c77b348849d53ac4d15908f3b74ee5d393445d62", package = "etas_effects" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "c77b348849d53ac4d15908f3b74ee5d393445d62", package = "etas_frontend" }
etas_hir = { git = "https://github.com/etas-project/etas-frontend.git", rev = "c77b348849d53ac4d15908f3b74ee5d393445d62", package = "etas_hir" }
etas_driver = { git = "https://github.com/etas-project/etas.git", rev = "a5f35cd12ec731c40adcabd3d9dcfe5bff9bbebf", package = "etas_driver" }
etas_package = { git = "https://github.com/etas-project/etas.git", rev = "a5f35cd12ec731c40adcabd3d9dcfe5bff9bbebf", package = "etas_package" }
etas_types = { git = "https://github.com/etas-project/etas-frontend.git", rev = "c77b348849d53ac4d15908f3b74ee5d393445d62", package = "etas_types" }
etas_syntax = { git = "https://github.com/etas-project/etas-frontend.git", rev = "c77b348849d53ac4d15908f3b74ee5d393445d62", package = "etas_syntax" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
