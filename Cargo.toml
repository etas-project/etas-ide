[workspace]
members = [
    "crates/etas_intel",
    "crates/etas_lsp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-ide"

[workspace.dependencies]
etas_intel = { path = "crates/etas_intel" }
etas_lsp = { path = "crates/etas_lsp" }

# Cross-repo dependencies via git (same pattern as other workspaces)
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "563dedc19ffbaa580cb8bc24e04c6d3d30261de1", package = "etas_core" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", rev = "563dedc19ffbaa580cb8bc24e04c6d3d30261de1", package = "etas_std" }
etas_effects = { git = "https://github.com/etas-project/etas-frontend.git", rev = "5fad86c409aae351da1b74ae0cb7d5d91cc35f26", package = "etas_effects" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "5fad86c409aae351da1b74ae0cb7d5d91cc35f26", package = "etas_frontend" }
etas_hir = { git = "https://github.com/etas-project/etas-frontend.git", rev = "5fad86c409aae351da1b74ae0cb7d5d91cc35f26", package = "etas_hir" }
etas_driver = { git = "https://github.com/etas-project/etas.git", rev = "c5af4eb8bc1a4209f1a536ac6e3ad1916c7ec42e", package = "etas_driver" }
etas_package = { git = "https://github.com/etas-project/etas.git", rev = "c5af4eb8bc1a4209f1a536ac6e3ad1916c7ec42e", package = "etas_package" }
etas_types = { git = "https://github.com/etas-project/etas-frontend.git", rev = "5fad86c409aae351da1b74ae0cb7d5d91cc35f26", package = "etas_types" }
etas_syntax = { git = "https://github.com/etas-project/etas-frontend.git", rev = "5fad86c409aae351da1b74ae0cb7d5d91cc35f26", package = "etas_syntax" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
