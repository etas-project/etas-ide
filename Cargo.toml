[workspace]
members = [
    "crates/etas_intel",
    "crates/etas_lsp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-ide"

[workspace.dependencies]
etas_intel = { path = "crates/etas_intel" }
etas_lsp = { path = "crates/etas_lsp" }

# Cross-repo dependencies via git (same pattern as other workspaces)
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "0f5db553b687185b471c3561a0d07109b03d7c09", package = "etas_core" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", rev = "0f5db553b687185b471c3561a0d07109b03d7c09", package = "etas_std" }
etas_effects = { git = "https://github.com/etas-project/etas-frontend.git", rev = "9ef6733d48dff8f2ecbfd887388db85346a06002", package = "etas_effects" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "9ef6733d48dff8f2ecbfd887388db85346a06002", package = "etas_frontend" }
etas_hir = { git = "https://github.com/etas-project/etas-frontend.git", rev = "9ef6733d48dff8f2ecbfd887388db85346a06002", package = "etas_hir" }
etas_driver = { git = "https://github.com/etas-project/etas.git", rev = "2fa08a63fc575511527ce2455df1aba717c1d97c", package = "etas_driver" }
etas_package = { git = "https://github.com/etas-project/etas.git", rev = "2fa08a63fc575511527ce2455df1aba717c1d97c", package = "etas_package" }
etas_types = { git = "https://github.com/etas-project/etas-frontend.git", rev = "9ef6733d48dff8f2ecbfd887388db85346a06002", package = "etas_types" }
etas_syntax = { git = "https://github.com/etas-project/etas-frontend.git", rev = "9ef6733d48dff8f2ecbfd887388db85346a06002", package = "etas_syntax" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
